<header class="navbar">
  <a routerLink="/" class="navbar-brand">
    <span class="brand-icon">VG</span>
    <span class="brand-name">Ranked</span>
  </a>

  <nav class="navbar-links">
    <a routerLink="/home" routerLinkActive="active"> 
      Inicio 
    </a>

    <a routerLink="/videojuegos" routerLinkActive="active">
      Videojuegos
    </a>

    <a routerLink="/companias" routerLinkActive="active">
      Compañías
    </a>

    <a routerLink="/consolas" routerLinkActive="active">
      Consolas
    </a>

  </nav>

  <div class="navbar-account">
    @if (api.usuarioActual(); as usuario) {
      <a routerLink="/mi-lista" routerLinkActive="active-list" class="my-list-button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Mi lista</span>
      </a>

      <div class="user-profile-badge">
        <div class="user-avatar-mini">
          @if (usuario.foto_perfil) {
            <img [src]="usuario.foto_perfil" [alt]="usuario.username" class="avatar-mini-img" />
          } @else {
            <span>{{ usuario.username.substring(0, 1).toUpperCase() }}</span>
          }
        </div>
        <span class="user-greeting">{{ usuario.username }}</span>
        <button type="button" class="logout-button" (click)="cerrarSesion()" title="Cerrar sesión">
          Salir
        </button>
      </div>
    } @else {
      <a routerLink="/login" class="login-button">
        Iniciar sesión
      </a>

      <a routerLink="/registro" class="register-button">
        Registrarse
      </a>
    }
  </div>
</header>

<main class="main-content">
  <router-outlet />
</main>
