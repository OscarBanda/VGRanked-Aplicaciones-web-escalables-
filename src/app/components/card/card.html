<article class="game-card">

  <div class="game-cover" [class]="'game-cover ' + coverClass">
    <span class="cover-brand">{{ brand }}</span>
    <h2>{{ displayNombre }}</h2>
  </div>

  <div class="game-info">
    @if (displaySubtitulo) {
      <span class="game-genre">{{ displaySubtitulo }}</span>
    }

    <h3>{{ displayNombre }}</h3>

    @if (displayDetalle) {
      <p class="platforms">{{ displayDetalle }}</p>
    }

    <div class="game-footer">
      <span>{{ scoreLabel }}</span>
      <strong>{{ formattedScore }}/10</strong>
    </div>
  </div>

</article>
