<div class="library-container">

    <app-library-header
        title="Biblioteca de Compañias"
        description="Descubre las compañias de videojuegos y descubre su calificación de la comunidad"
        [count]="companiasFiltradas.length"
        countLabel="compañías encontradas"
    />

    <!-- Búsqueda y filtros -->
    <app-filter-bar
        searchLabel="Buscar compañía"
        [(search)]="busqueda"
        filterLabel="País"
        [filterOptions]="paises"
        [(filter)]="paisSeleccionado"
        [(order)]="ordenSeleccionado"
    />

    <!-- Cuadrícula de compañias -->
    <section class="games-grid">

        @for (compania of companiasFiltradas; track compania.nombre) {
        <app-card
            [nombre]="compania.nombre"
            [detalle]="compania.pais"
            [score]="compania.score"
            [color]="compania.color"
        />
        } @empty {
        <div class="empty-results">
            <h2>No se encontraron compañias</h2>
            <p>Prueba con otro nombre</p>
        </div>
        }

    </section>

</div>
