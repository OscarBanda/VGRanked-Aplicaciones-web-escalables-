
<div class="library-container">

  <app-library-header
    title="Biblioteca de videojuegos"
    description="Encuentra tu próximo juego favorito y descubre cómo lo califica la comunidad."
    [count]="videojuegosFiltrados.length"
    countLabel="videojuegos encontrados"
  />

  <!-- Búsqueda y filtros -->
  <app-filter-bar
    searchLabel="Buscar videojuego"
    [(search)]="busqueda"
    filterLabel="Género"
    [filterOptions]="generos"
    [(filter)]="generoSeleccionado"
    [(order)]="ordenSeleccionado"
  />

  <!-- Cuadrícula de videojuegos -->
  <section class="games-grid">

    @for (juego of videojuegosFiltrados; track juego.nombre) {
      <app-card
        [nombre]="juego.nombre"
        [subtitulo]="juego.genero"
        [detalle]="juego.plataformas"
        [score]="juego.score"
        [color]="juego.color"
      />
    } @empty {
      <div class="empty-results">
        <h2>No se encontraron videojuegos</h2>
        <p>Prueba con otro nombre o selecciona un género diferente.</p>
      </div>
    }

  </section>

</div>
